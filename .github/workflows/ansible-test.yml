name: Test Azure Login Self-Hosted

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-login:
    runs-on:
      - self-hosted
      - linux
      - azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Informations du runner
        run: |
          echo "=== SELF-HOSTED RUNNER ==="
          hostname
          whoami
          uname -a

      - name: Azure Login avec OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sélectionner la subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Vérifier la connexion Azure
        run: |
          az account show --output table

      - name: Vérifier Terraform
        run: |
          terraform version
